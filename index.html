<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rocket Dodge 3D — Rebuilt</title>
<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#03060f;
    font-family:"Segoe UI",system-ui,sans-serif; color:#fff;
    user-select:none;
  }
  canvas { display:block; }
  #hud {
    position:fixed; top:18px; left:22px; z-index:10;
    font-size:24px; font-weight:800; text-shadow:0 3px 12px #000;
  }
  #hud span { color:#ffc93c; }
  #sub {
    position:fixed; top:54px; left:22px; z-index:10;
    font-size:14px; color:#9fb4dd; text-shadow:0 2px 8px #000;
  }
  #help {
    position:fixed; bottom:18px; left:22px; z-index:10;
    font-size:14px; color:#8fa4cc; text-shadow:0 2px 8px #000;
  }
  #touch {
    display:none; position:fixed; left:0; right:0; bottom:22px;
    z-index:25; padding:0 22px; justify-content:space-between;
    align-items:flex-end; pointer-events:none;
  }
  #touch button {
    pointer-events:auto; touch-action:none; user-select:none;
    min-width:58px; min-height:58px; border-radius:16px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(18,27,50,.78); color:#fff;
    font-size:20px; font-weight:900;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  #touch button:active { background:rgba(60,90,160,.95); transform:scale(.96); }
  #touch .pad { display:flex; align-items:center; gap:8px; }
  #touch .col { display:flex; flex-direction:column; gap:8px; }
  #touch #fireBtn {
    min-width:96px; min-height:96px; border-radius:50%;
    background:rgba(190,35,45,.85); border-color:#ff8b8b; font-size:17px;
  }
  @media (pointer: coarse), (max-width: 700px) {
    #touch { display:flex; }
    #help { display:none; }
    #hud { font-size:20px; }
    #sub { font-size:12px; }
  }
  #recBtn {
    position:fixed; top:16px; right:20px; z-index:30;
    padding:10px 16px; border-radius:12px; cursor:pointer;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(20,28,50,.85); color:#fff;
    font-size:14px; font-weight:800;
  }
  #recBtn.recording { background:#d81f2a; border-color:#ff6b6b; }
  #recStatus {
    position:fixed; top:58px; right:20px; z-index:30;
    font-size:12px; color:#ffb3b3; display:none;
  }
  #cross {
    position:fixed; left:50%; top:50%; width:18px; height:18px;
    margin:-9px 0 0 -9px; z-index:9; pointer-events:none;
  }
  #cross::before,#cross::after { content:""; position:absolute; background:rgba(120,255,255,.7); }
  #cross::before { left:8px; top:0; width:2px; height:18px; }
  #cross::after { top:8px; left:0; height:2px; width:18px; }
  #loading {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:9; font-size:18px; color:#ffc93c;
  }
  #over {
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; background:rgba(3,6,15,.74);
  }
  #over .box {
    text-align:center; padding:34px 52px; border-radius:22px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(14,22,42,.95); box-shadow:0 30px 90px rgba(0,0,0,.7);
  }
  #over h1 { margin:0 0 8px; font-size:52px; color:#ff5b5b; }
  #over p { margin:5px 0; font-size:19px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <div id="hud">SCORE <span id="score">0</span></div>
  <div id="sub">KILLS <span id="kills">0</span> &nbsp;•&nbsp; HITS <span id="hits">0</span></div>
  <button id="recBtn">● REC</button>
  <div id="recStatus">Recording… click STOP to save</div>
  <div id="help">WASD / Arrows = move &nbsp;•&nbsp; SPACE = fire &nbsp;•&nbsp; R = restart</div>
  <div id="touch">
    <div class="pad">
      <button data-key="arrowleft" aria-label="Move left">◀</button>
      <div class="col">
        <button data-key="arrowup" aria-label="Move up">▲</button>
        <button data-key="arrowdown" aria-label="Move down">▼</button>
      </div>
      <button data-key="arrowright" aria-label="Move right">▶</button>
    </div>
    <button id="fireBtn" aria-label="Fire">FIRE</button>
  </div>
  <div id="cross"></div>
  <div id="loading">Loading rocket…</div>
  <div id="over"><div class="box"><h1>GAME OVER</h1><p>Score: <span id="finalScore">0</span></p><p style="font-size:14px;color:#9aa8c7">Press R to fly again</p></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- procedural textures ---------- */
function tex(draw, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rockTex = tex((ctx,s) => {
  const img = ctx.createImageData(s,s);
  for (let i=0;i<img.data.length;i+=4) {
    const v = 72 + Math.random()*60;
    img.data[i]=v*1.12; img.data[i+1]=v; img.data[i+2]=v*.8; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  for (let i=0;i<45;i++) {
    ctx.beginPath(); ctx.arc(Math.random()*s,Math.random()*s,2+Math.random()*13,0,Math.PI*2);
    ctx.fillStyle=`rgba(35,30,26,${.18+Math.random()*.35})`; ctx.fill();
  }
});
const redTex = tex((ctx,s) => {
  ctx.fillStyle='#c8141c'; ctx.fillRect(0,0,s,s);
  for (let i=0;i<160;i++) { ctx.fillStyle=`rgba(255,255,255,${Math.random()*.05})`; ctx.fillRect(Math.random()*s,Math.random()*s,2,1); }
});
const whiteTex = tex((ctx,s) => {
  ctx.fillStyle='#f1f1ec'; ctx.fillRect(0,0,s,s);
  for (let i=0;i<120;i++) { ctx.fillStyle=`rgba(120,130,150,${Math.random()*.05})`; ctx.fillRect(Math.random()*s,Math.random()*s,2,1); }
});
const blueTex = tex((ctx,s) => {
  ctx.fillStyle='#0b4fd6'; ctx.fillRect(0,0,s,s);
  for (let i=0;i<120;i++) { ctx.fillStyle=`rgba(255,255,255,${Math.random()*.06})`; ctx.fillRect(Math.random()*s,Math.random()*s,2,1); }
});
const skyTex = tex((ctx,s) => {
  const g=ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#03060f'); g.addColorStop(.5,'#0a1230'); g.addColorStop(1,'#050914');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  for (let i=0;i<420;i++) { ctx.fillStyle=`rgba(255,255,255,${.25+Math.random()*.6})`; ctx.fillRect(Math.random()*s,Math.random()*s,1,1); }
}, 512);

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = skyTex;
scene.fog = new THREE.FogExp2(0x050914, 0.005);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 2.6, 9);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x88aaff, 0x0a0a14, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.position.set(6,10,8);
scene.add(sun);

/* ---------- rocket ---------- */
const rocketGroup = new THREE.Group();
scene.add(rocketGroup);

const redMat = new THREE.MeshStandardMaterial({ map:redTex, metalness:.35, roughness:.35 });
const whiteMat = new THREE.MeshStandardMaterial({ map:whiteTex, metalness:.25, roughness:.4 });
const blueMat = new THREE.MeshStandardMaterial({ map:blueTex, metalness:.3, roughness:.38 });
const windowMat = new THREE.MeshStandardMaterial({ color:0x0a4f9e, emissive:0x1a73ff, emissiveIntensity:1.1, metalness:.2, roughness:.12 });
const flameMat = new THREE.MeshBasicMaterial({ color:0xff7a18, transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false });

const fallback = new THREE.Group();
const fbBody = new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,2.3,12), redMat);
fbBody.rotation.x = Math.PI/2;
fallback.add(fbBody);
const fbNose = new THREE.Mesh(new THREE.ConeGeometry(.45,1,12), whiteMat);
fbNose.rotation.x = -Math.PI/2; fbNose.position.z = -1.6;
fallback.add(fbNose);
rocketGroup.add(fallback);

const exhaust = new THREE.PointLight(0xff6a1a, 5, 16);
exhaust.position.set(0,0,1);
rocketGroup.add(exhaust);

const loader = new GLTFLoader();
loader.load('rocket.glb', (gltf) => {
  const rocket = gltf.scene;
  // glTF is Y-up; Blender rocket nose became +Y. Point it toward -Z (forward).
  rocket.rotation.x = -Math.PI / 2;
  rocket.scale.setScalar(1.0);
  rocket.traverse((c) => {
    if (!c.isMesh) return;
    const n = (c.material && c.material.name) || '';
    if (n.includes('Red')) c.material = redMat;
    else if (n.includes('White')) c.material = whiteMat;
    else if (n.includes('Blue') && !n.includes('Window')) c.material = blueMat;
    else if (n.includes('Window')) c.material = windowMat;
    else if (n.includes('Flame')) c.material = flameMat;
    else c.material = redMat;
  });
  rocketGroup.add(rocket);
  rocketGroup.remove(fallback);
  document.getElementById('loading').style.display = 'none';
}, undefined, () => {
  document.getElementById('loading').textContent = 'Using backup rocket';
  setTimeout(() => document.getElementById('loading').style.display='none', 1500);
});

/* ---------- asteroids ---------- */
const asteroids = [];
function astGeometry() {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) {
    const v = new THREE.Vector3().fromBufferAttribute(p,i);
    v.multiplyScalar(1 + (Math.random()-.5)*.4);
    p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals();
  return g;
}
function spawnAsteroid(initial=false) {
  const s = .7 + Math.random()*1.6;
  const small = s < 1.3;
  const a = new THREE.Mesh(
    astGeometry(),
    new THREE.MeshStandardMaterial({ map:rockTex, bumpMap:rockTex, bumpScale:.05, roughness:.95 })
  );
  a.scale.setScalar(s);
  a.position.set(
    (Math.random()-.5)*18,
    (Math.random()-.5)*10 + 1,
    initial ? -15 - Math.random()*90 : -105 - Math.random()*40
  );
  a.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  a.userData = {
    speed: 8 + Math.random()*10,
    spin: new THREE.Vector3((Math.random()-.5)*2,(Math.random()-.5)*2,(Math.random()-.5)*2),
    hp: small ? 5 : 8, small, hitTimer:0
  };
  scene.add(a);
  asteroids.push(a);
}
for (let i=0;i<9;i++) spawnAsteroid(true);

/* ---------- bullets + explosions ---------- */
const bullets = [];
const bulletGeo = new THREE.CylinderGeometry(.05,.05,.6,8);
bulletGeo.rotateX(Math.PI/2);
const bulletMat = new THREE.MeshBasicMaterial({ color:0x7fffff });
function fireBullet() {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(rocketGroup.position).add(new THREE.Vector3(0,0,-4.2));
  scene.add(b);
  bullets.push({ mesh:b, life:0 });
}

const explosions = [];
const partGeo = new THREE.SphereGeometry(.1, 6, 6);
function explode(pos, size=1) {
  const group = new THREE.Group(); group.position.copy(pos);
  const parts = [];
  for (let i=0;i<18;i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({
      color: Math.random()>.45 ? 0xffc247 : 0xff3b12,
      transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    group.add(m);
    parts.push({ mesh:m, vel:new THREE.Vector3((Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8).multiplyScalar(size) });
  }
  const light = new THREE.PointLight(0xff7a22, 9*size, 20);
  group.add(light);
  scene.add(group);
  explosions.push({ group, parts, light, life:0, max:1.0 });
}

/* ---------- input / state ---------- */
const keys = {};
function fireNow() {
  if (!gameOver && cooldown <= 0) {
    fireBullet();
    cooldown = .16;
  }
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    keys.space = true;
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    // Fire on the key press itself, so even a very quick tap is never missed.
    fireNow();
  } else {
    keys[e.key.toLowerCase()] = true;
  }
  if (e.key.toLowerCase() === 'r') restart();
});
addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.key === ' ') keys.space = false;
  else keys[e.key.toLowerCase()] = false;
});
addEventListener('pointerdown', () => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
});

// Touch controls for phones and tablets.
document.querySelectorAll('#touch [data-key]').forEach((btn) => {
  const k = btn.dataset.key;
  const down = (e) => { e.preventDefault(); keys[k] = true; };
  const up = (e) => { e.preventDefault(); keys[k] = false; };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
});
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  keys.space = true;
  fireNow();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
  fireBtn.addEventListener(type, (e) => { e.preventDefault(); keys.space = false; });
});

const demo = new URLSearchParams(location.search).has('demo');
const scoreEl = document.getElementById('score');
const killsEl = document.getElementById('kills');
const hitsEl = document.getElementById('hits');
const finalEl = document.getElementById('finalScore');
const overEl = document.getElementById('over');

let scoreAcc = 0, score = 0, kills = 0, hits = 0;
let gameOver = false, cooldown = 0, shake = 0;

function hud() {
  scoreEl.textContent = score;
  killsEl.textContent = kills;
  hitsEl.textContent = hits;
}
function restart() {
  scoreAcc = score = kills = hits = 0;
  gameOver = false; shake = 0;
  overEl.style.display = 'none';
  rocketGroup.position.set(0,0,0);
  for (const a of asteroids) a.position.set((Math.random()-.5)*18,(Math.random()-.5)*10+1,-15-Math.random()*100);
  for (const b of bullets) scene.remove(b.mesh);
  bullets.length = 0;
  hud();
}
hud();

/* ---------- recorder button ---------- */
let mediaRecorder = null, recChunks = [];
const recBtn = document.getElementById('recBtn');
const recStatus = document.getElementById('recStatus');
recBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  if (!renderer.domElement.captureStream || !window.MediaRecorder) { recBtn.textContent='unsupported'; return; }
  const stream = renderer.domElement.captureStream(30);
  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond:5000000 });
  recChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(recChunks, { type:mediaRecorder.mimeType || 'video/webm' }));
    const a = document.createElement('a'); a.href=url; a.download='rocket_dodge_clip.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    recBtn.textContent='● REC'; recBtn.classList.remove('recording'); recStatus.style.display='none';
  };
  mediaRecorder.start(200);
  recBtn.textContent='■ STOP'; recBtn.classList.add('recording'); recStatus.style.display='block';
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const tmpBoxA = new THREE.Box3();
const tmpBoxB = new THREE.Box3();
const tmpBoxBullet = new THREE.Box3();

// Small read-only hook so the rebuild can be verified in the browser console.
window.__gameDebug = {
  snapshot() {
    const rocket = new THREE.Box3().setFromObject(rocketGroup);
    return {
      bullets: bullets.length,
      asteroids: asteroids.length,
      score, kills, hits,
      space: !!keys.space,
      cooldown: Number(cooldown.toFixed(3)),
      rocketMin: rocket.min.toArray(),
      rocketMax: rocket.max.toArray()
    };
  }
};

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .04);

  if (!gameOver) {
    if (demo) {
      const tx = Math.sin(performance.now()/900)*7;
      const ty = Math.sin(performance.now()/1400)*3.5;
      rocketGroup.position.x += (tx-rocketGroup.position.x)*Math.min(1,dt*2);
      rocketGroup.position.y += (ty-rocketGroup.position.y)*Math.min(1,dt*2);
    } else {
      const sp = 11;
      if (keys['a']||keys['arrowleft']) rocketGroup.position.x -= sp*dt;
      if (keys['d']||keys['arrowright']) rocketGroup.position.x += sp*dt;
      if (keys['w']||keys['arrowup']) rocketGroup.position.y += sp*dt;
      if (keys['s']||keys['arrowdown']) rocketGroup.position.y -= sp*dt;
    }
    rocketGroup.position.x = Math.max(-10,Math.min(10,rocketGroup.position.x));
    rocketGroup.position.y = Math.max(-5,Math.min(6,rocketGroup.position.y));

    cooldown -= dt;
    if (keys.space || demo) fireNow();

    // bullets vs asteroids using real boxes
    for (let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i];
      b.mesh.position.z -= 80*dt;
      b.life += dt;
      let gone = false;
      tmpBoxBullet.setFromObject(b.mesh);
      for (const a of asteroids) {
        tmpBoxA.setFromObject(a);
        if (tmpBoxBullet.intersectsBox(tmpBoxA)) {
          a.userData.hp--; hits++; a.userData.hitTimer = .14;
          explode(b.mesh.position, .2);
          gone = true;
          if (a.userData.hp <= 0) {
            explode(a.position, a.scale.x);
            score += a.userData.small ? 50 : 100;
            kills++;
            scene.remove(a);
            const idx = asteroids.indexOf(a); if (idx>=0) asteroids.splice(idx,1);
            spawnAsteroid(false);
          }
          break;
        }
      }
      if (gone || b.life > 1.8 || b.mesh.position.z < -130) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    // asteroids + rocket collision using real boxes
    tmpBoxB.setFromObject(rocketGroup);
    for (const a of asteroids) {
      a.position.z += a.userData.speed*dt;
      a.rotation.x += a.userData.spin.x*dt;
      a.rotation.y += a.userData.spin.y*dt;
      a.rotation.z += a.userData.spin.z*dt;
      if (a.userData.hitTimer > 0) a.userData.hitTimer -= dt;
      if (a.position.z > 14) a.position.set((Math.random()-.5)*18,(Math.random()-.5)*10+1,-105-Math.random()*40);
      tmpBoxA.setFromObject(a);
      if (tmpBoxB.intersectsBox(tmpBoxA)) {
        gameOver = true;
        explode(rocketGroup.position, 1.4);
        finalEl.textContent = score;
        overEl.style.display = 'flex';
      }
    }

    scoreAcc += dt*5;
    score = Math.floor(scoreAcc);
    hud();
  }

  for (let i=explosions.length-1;i>=0;i--) {
    const e = explosions[i]; e.life += dt;
    const t = e.life/e.max;
    for (const p of e.parts) {
      p.mesh.position.addScaledVector(p.vel,dt);
      p.vel.multiplyScalar(.96);
      p.mesh.material.opacity = Math.max(0,1-t);
    }
    e.light.intensity = 9*(1-t);
    if (t>=1) { scene.remove(e.group); explosions.splice(i,1); }
  }

  exhaust.intensity = 4 + Math.sin(performance.now()/30)*1 + Math.random()*.5;
  shake = Math.max(0, shake-dt*1.5);
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  camera.position.x += (rocketGroup.position.x*.35+sx-camera.position.x)*.08;
  camera.position.y += (2.6+rocketGroup.position.y*.25+sy-camera.position.y)*.08;
  camera.lookAt(rocketGroup.position.x*.4, rocketGroup.position.y*.4, -20);

  renderer.render(scene,camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
